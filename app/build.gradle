plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // NOTE: kotlin.plugin.compose is only for Kotlin 2.0+
    // We use Kotlin 1.9 here which uses composeOptions block instead
}

android {
    namespace 'com.example.composedemo'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.composedemo"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
    }

    // Required for Kotlin 1.9.x — tells Compose which compiler to use
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation "androidx.appcompat:appcompat:1.7.0"

    // Compose BOM — manages all compose versions in one place
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // ── Instrumented test dependencies ────────────────────────────────────
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    // Adds the blank test Activity to debug APK for Compose tests
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
